<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Chá de Casa Nova — Lucilly & Ana Aline</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- HEADER -->
<header class="header">
  <p class="header-eyebrow"><span>✦</span> Chá de Casa Nova <span>✦</span></p>
  <h1>Lucilly <em>&</em><br>Ana Aline</h1>
  <p class="header-subtitle">Escolha um presente para nos ajudar a montar nosso lar com muito amor 🏠🌈</p>
  <div class="stats">
    <div class="stat"><div class="stat-number" id="stat-total">200</div><div class="stat-label">itens no total</div></div>
    <div class="stat"><div class="stat-number" id="stat-available">200</div><div class="stat-label">disponíveis</div></div>
    <div class="stat"><div class="stat-number" id="stat-gifted">0</div><div class="stat-label">já presenteados</div></div>
  </div>
</header>

<!-- SYNC BAR -->
<div class="sync-bar">
  <div class="sync-dot" id="sync-dot"></div>
  <span id="sync-label">Verificando presentes...</span>
</div>

<!-- FILTERS -->
<nav class="filters-wrap">
  <div class="filters" id="filters"></div>
</nav>

<!-- GRID -->
<main class="grid-wrap">
  <div class="grid" id="grid"></div>
</main>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- SCROLL TOP -->
<button class="scroll-top" id="scroll-top" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

<!-- PRODUTOS -->
<script src="js/products.js"></script>
<script src="js/app.js"></script>
</body>
</html>
